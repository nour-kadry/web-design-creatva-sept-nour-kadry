<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <h1>Registration Form</h1>
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" name="firstName" spattern="[A-Za-z\s]+"  >
        <label for="phone">phone:</label>
        <input type="tel" id="phone" name="phone"  pattern="01[012][0-9]{8}" placeholder="01xxxxxxxxx" oninvalid="this.setCustomValidity('Please enter a valid phone number starting with 010, 011, or 012 and containing 11 digits.')"
    oninput="this.setCustomValidity('')"> <br> <br>
        <label for="course">Course:</label>
        <input type="text" id="course" name="course" list="Coruses">
        <datalist id="Coruses">
            <option value="htlml">
            <option value="css">
            <option value="jsr">
        </datalist>
            <label for="imge">Image:</label>
        <input type="file" id="imge" name="imge" accept=".png" ><br>
        <textarea id="message" name="message" minlength="20" maxlength="100" placeholder="Enter your message here..."></textarea><br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required><br>
        <label for="id">id:</label>
        <input type="text" id="id" name="id" pattern="[0-9]{14}" placeholder="Enter your 14-digit ID"><br>
        
        <button> submit</button>
    </form>
    
</body>
</html>
