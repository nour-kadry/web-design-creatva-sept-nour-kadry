<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="container">
        <div class="flip-card">
            <div class="inner-card">
                <div class="front">
                    <div class="front-content d-flex space">
                        <div class="front-text">
                            <h1>Finacial Sector Development program</h1>
                        </div>
                        <div class="front-icon">
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>
                    </div>
                </div>
                <div class="back">
                    <div>
                        <div class="back-content">
                            <div class="map">
                                <i class="fa-regular fa-map"></i>
                            </div>
                            <h1>Finacial Sector Development program</h1>
                            <p>The Program aims to develop a diversified and effective financial sector to support the development of the Aaudi Arabias economy</p>
                        </div>
                        <div class="back-btn">
                            <button>Read More</button>
                            <i class="fa-solid fa-arrow-right"></i>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </section>

</body>
</html>
